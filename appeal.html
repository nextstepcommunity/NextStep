<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appeal — Next Step</title>
  <meta name="description" content="Appeal to Next Step using the official appeal portal or an alternative invite code.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">Next Step</a>
      <button class="nav-toggle" aria-controls="primary-navigation" aria-expanded="false">Menu</button>
      <nav id="primary-navigation" class="nav-menu" aria-label="Primary navigation">
        <a class="nav-link" href="index.html#home">Home</a>
        <a class="nav-link" href="index.html#about">About</a>
        <a class="nav-link" href="index.html#community">Community</a>
        <a class="nav-link" href="index.html#play">Play</a>
        <a class="nav-link" href="index.html#rules">Rules</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="page-section">
      <div class="glass-box contact-box">
        <h1>Appeal to Next Step</h1>

        <p class="link-with-help">
          <a href="https://appeal.gg/gT8HTsZd2d" target="_blank" rel="noopener noreferrer">
            https://appeal.gg/gT8HTsZd2d
          </a>

          <button
            type="button"
            class="small-toggle-button help-links-toggle"
            data-target="help-links-appeal"
            aria-expanded="false">
            Not working?
          </button>
        </p>

        <div class="help-links-list" id="help-links-appeal" hidden>
          <p>Alternative links:</p>
          <div class="not-working-grid">
            <a href="https://appeal.gg/QtX3gUPA66" target="_blank">QtX3gUPA66</a>
            <a href="https://appeal.gg/V5G9UEbBux" target="_blank">V5G9UEbBux</a>
            <a href="https://appeal.gg/V88vRQTCXY" target="_blank">V88vRQTCXY</a>
            <a href="https://appeal.gg/4FzSaG3Gkt" target="_blank">4FzSaG3Gkt</a>
            <a href="https://appeal.gg/284wdhVC22" target="_blank">284wdhVC22</a>
            <a href="https://appeal.gg/NS9burTzwp" target="_blank">NS9burTzwp</a>
            <a href="https://appeal.gg/uFkwEbBmPx" target="_blank">uFkwEbBmPx</a>
            <a href="https://appeal.gg/gT8HTsZd2d" target="_blank">gT8HTsZd2d</a>
            <a href="https://appeal.gg/emRhBxmn5w" target="_blank">emRhBxmn5w</a>
            <a href="https://appeal.gg/762MzWjJXv" target="_blank">762MzWjJXv</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Next Step. Helping you with your next step.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.help-links-toggle').forEach(function (button) {
        button.addEventListener('click', function () {
          const target = document.getElementById(button.dataset.target);
          if (!target) return;

          const isOpen = button.getAttribute('aria-expanded') === 'true';
          button.setAttribute('aria-expanded', String(!isOpen));
          target.hidden = isOpen;
          button.textContent = isOpen ? 'Not working?' : 'Hide links';
        });
      });
    });
  </script>
</body>
</html>
